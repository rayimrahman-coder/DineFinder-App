name: dinefinder
description: Discover nearby restaurants through a camera compass and walking directions.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.1
  cupertino_icons: 1.0.8
  flutter_compass: 0.8.1
  geolocator: 14.1.2
  http: 1.6.0
  supabase_flutter: 2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
