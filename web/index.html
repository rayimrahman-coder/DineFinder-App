<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find your next favorite bite, right around you.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DineFinder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DineFinder · Find your next favorite bite</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#102722">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>html,body{margin:0;min-height:100%;background:#102722;color:#f6f6f0;font-family:system-ui,sans-serif}.boot{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:12px}.boot img{margin:auto;border-radius:25px}.boot p{margin:0;color:#b8c9bd;font-size:14px}.boot h1{margin:8px 0;font-size:28px;letter-spacing:-1px}</style>
</head>
<body>
  <div class="boot" id="boot" role="status"><img src="icons/Icon-192.png" width="80" height="80" alt=""><h1>DineFinder</h1><p>A good meal is closer than you think.</p></div>
  <noscript>Enable JavaScript to use DineFinder.</noscript>
  <script>window.addEventListener("flutter-first-frame",()=>document.getElementById("boot")?.remove());</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
